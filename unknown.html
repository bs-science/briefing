<body data-page="unknown"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span>12조 스펙트라</a><nav class="nav"><a href="index.html">Canva</a><a href="spectrum.html">스펙트럼</a><a href="calibration.html">검량선</a><a href="unknown.html">미지 시료</a><a href="controls.html">통제변인</a><a href="errors.html">측정오차</a><a href="workflow.html">실험과정</a></nav></header>
<main class="page-shell"><section class="hero"><div><p class="eyebrow">Simulation 03</p><h1>미지 시료 농도 예측</h1><p class="lead">검량선에 사용하지 않은 0.7 M 또는 1.3 M 시료를 선택해 예측값과 상대오차를 확인합니다.</p></div><div class="notice"><strong>설명용 가상 데이터</strong><br>예측값은 인터페이스 시연을 위한 값이며 실제 측정 성능을 의미하지 않습니다.</div></section>
<section class="grid"><article class="panel"><div class="panel-title panel-pad"><h2>검량선 보간</h2><div class="legend"><span style="--legend:#58e0d1">표준</span><span style="--legend:#ffc86b">미지 시료</span></div></div><div class="chart-wrap"><canvas id="unknownChart"></canvas></div></article><aside class="panel panel-pad"><div class="controls"><div class="control"><label for="unknownSelect">미지 시료</label><select id="unknownSelect"><option value="0.7">시료 A</option><option value="1.3">시료 B</option></select></div><button class="button" id="measureUnknown">가상 측정 실행</button><div class="metrics"><div class="metric"><div class="metric-label">측정 흡광도비</div><div class="metric-value" id="measuredRatio">-</div></div><div class="metric"><div class="metric-label">예측 농도</div><div class="metric-value" id="predicted">-</div></div><div class="metric"><div class="metric-label">실제 농도</div><div class="metric-value" id="actual">비공개</div></div><div class="metric"><div class="metric-label">상대오차</div><div class="metric-value" id="relativeError">-</div></div></div><div class="formula">상대오차 = |예측−실제| / 실제 × 100</div></div></aside></section></main><script src="app.js"></script></body></html>
