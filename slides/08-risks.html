<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오차와 실패 대안</title><link rel="stylesheet" href="../css/slides.css"><link rel="stylesheet" href="../css/simulations.css"></head><body data-slide="7"><main class="slide"><header class="slide-head compact"><p class="kicker">07 · Risks & alternatives</p><h2>가장 큰 위험은 “변화가 너무 작은 것”</h2></header><section class="sim-layout"><article class="panel chart-panel"><div class="panel-head"><h3>정상 측정과 오차 포함 측정</h3><div class="legend"><span style="--dot:#55e1d2">정상</span><span style="--dot:#ff7889">오차 포함</span></div></div><div class="chart-wrap"><canvas id="error-chart"></canvas></div></article><aside class="panel controls"><span id="error-state" class="status"></span><div class="check-grid"><label class="check-item"><input type="checkbox" data-error="bubble"><span>큐벳 기포<small>산란과 바탕 증가</small></span></label><label class="check-item"><input type="checkbox" data-error="fingerprint"><span>큐벳 지문<small>투과율 감소 가능</small></span></label><label class="check-item"><input type="checkbox" data-error="ph"><span>pH 차이<small>mCP 화학종 비율 변화</small></span></label><label class="check-item"><input type="checkbox" data-error="temp"><span>온도 차이<small>평형과 흡광도 변화</small></span></label><label class="check-item"><input type="checkbox" data-error="noise"><span>장비 잡음<small>미세한 효과를 가림</small></span></label></div></aside></section><section class="risk-grid"><div class="risk-card"><b>신호가 너무 작음</b><span>넓은 농도 범위 예비실험과 여러 지표 비교</span></div><div class="risk-card"><b>흡광도 범위 초과</b><span>모든 시료의 mCP 첨가량을 낮춰 재설정</span></div><div class="risk-card"><b>이상치 발생</b><span>pH·기포·오염·제조 기록을 확인한 뒤 재측정</span></div></section></main><script src="../js/charts.js"></script><script src="../js/simulations.js"></script><script src="../js/navigation.js"></script></body></html>
