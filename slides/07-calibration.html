<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검량선과 미지 시료</title><link rel="stylesheet" href="../css/slides.css"><link rel="stylesheet" href="../css/simulations.css"></head><body data-slide="6"><main class="slide"><header class="slide-head compact"><p class="kicker">06 · Calibration</p><h2>관측값으로 미지 농도를 예측한다</h2><p class="lead">표준 시료의 흡광도비로 검량선을 만든 뒤, 검량선에 쓰지 않은 미지 시료를 보간합니다.</p></header><section class="sim-layout"><article class="panel chart-panel"><div class="panel-head"><h3>흡광도비 검량선</h3><div class="legend"><span style="--dot:#67aaff">표준 시료</span><span style="--dot:#ffc966">미지 시료</span></div></div><div class="chart-wrap"><canvas id="calibration-chart"></canvas></div></article><aside class="panel controls"><div class="notice"><strong>설명용 가상 데이터</strong><br>실제 모델은 RMSE·잔차·과적합을 비교해 결정합니다.</div><div class="control"><label for="unknown-select">미지 시료</label><select id="unknown-select"><option value=".7">시료 A · 0.7 M</option><option value="1.3">시료 B · 1.3 M</option></select></div><button id="unknown-button" class="action-button" type="button">가상 측정 실행</button><div class="tiny-metrics"><div class="tiny-metric"><small>예측 농도</small><b id="prediction-output">-</b></div><div class="tiny-metric"><small>상대오차</small><b id="error-output">-</b></div></div><div class="formula">상대오차 = |예측−실제| / 실제 × 100</div></aside></section></main><script src="../js/charts.js"></script><script src="../js/simulations.js"></script><script src="../js/navigation.js"></script></body></html>
