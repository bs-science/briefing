<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연구 질문과 범위</title><link rel="stylesheet" href="../css/slides.css"></head><body data-slide="1"><main class="slide"><header class="slide-head"><p class="kicker">01 · Research question</p><h2>무엇을 확인하려는가?</h2></header><section class="two-col wide-left"><article class="card question-box accent-card"><p class="kicker">핵심 연구 질문</p><blockquote>pH가 일정할 때, NaCl 농도에 따라 mCP의 흡수 스펙트럼에는 측정 가능한 규칙성이 나타나는가?</blockquote><p class="lead">규칙성이 충분히 크고 재현된다면 미지 시료의 NaCl 농도 예측에 활용할 수 있는지 검토합니다.</p></article><aside class="card"><h3>관찰 범위</h3><div class="scope-list"><div class="scope-item"><span>NaCl</span><b>0.0~1.6 M</b></div><div class="scope-item"><span>파장</span><b>400~700 nm</b></div><div class="scope-item"><span>pH</span><b>8.2 부근</b></div><div class="scope-item"><span>온도</span><b>25±1 ℃</b></div><div class="scope-item"><span>반복</span><b>농도별 독립 3회</b></div></div></aside></section></main><script src="../js/navigation.js"></script></body></html>
