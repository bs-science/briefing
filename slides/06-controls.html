<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통제변인 시뮬레이션</title><link rel="stylesheet" href="../css/slides.css"><link rel="stylesheet" href="../css/simulations.css"></head><body data-slide="5"><main class="slide"><header class="slide-head compact"><p class="kicker">05 · Control variables</p><h2>NaCl 이외의 영향은 어떻게 분리하는가?</h2><p class="lead">mCP는 pH에 민감하므로 pH와 온도가 달라지면 NaCl 효과처럼 보이는 변화가 생길 수 있습니다.</p></header><section class="sim-layout"><article class="panel chart-panel"><div class="panel-head"><h3>기준 조건과 변경 조건</h3><div class="legend"><span style="--dot:#67aaff">pH 8.2 · 25℃</span><span style="--dot:#ffc966">변경 조건</span></div></div><div class="chart-wrap"><canvas id="control-chart"></canvas></div></article><aside class="panel controls"><span id="control-state" class="status"></span><div class="control"><div class="control-row"><label for="ph-range">pH</label><output id="ph-output"></output></div><input id="ph-range" type="range" min="7.8" max="8.6" step=".01" value="8.2"></div><div class="control"><div class="control-row"><label for="temp-range">온도</label><output id="temp-output"></output></div><input id="temp-range" type="range" min="20" max="30" step="1" value="25"></div><div class="card" style="padding:15px"><h3>판정 기준</h3><p class="sim-note">시료 간 pH 차이가 0.05 이상이면 제조 과정을 점검하고 다시 제조합니다. 온도는 실제 측정값을 함께 기록합니다.</p></div><div class="notice">그래프 변화량은 통제 필요성을 설명하기 위한 예시입니다.</div></aside></section></main><script src="../js/charts.js"></script><script src="../js/simulations.js"></script><script src="../js/navigation.js"></script></body></html>
