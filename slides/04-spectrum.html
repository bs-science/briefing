<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>흡수 스펙트럼 시뮬레이션</title><link rel="stylesheet" href="../css/slides.css"><link rel="stylesheet" href="../css/simulations.css"></head><body data-slide="3"><main class="slide"><header class="slide-head compact"><p class="kicker">03 · Measurement principle</p><h2>농도 변화는 어떻게 읽는가?</h2><p class="lead">434 nm와 578 nm 부근의 흡광도 및 두 값의 비를 비교합니다.</p></header><section class="sim-layout"><article class="panel chart-panel"><div class="panel-head"><h3>400~700 nm 흡수 스펙트럼</h3><div class="legend"><span style="--dot:#67aaff">0.0 M 기준</span><span style="--dot:#55e1d2">선택 농도</span></div></div><div class="chart-wrap"><canvas id="spectrum-chart"></canvas></div></article><aside class="panel controls"><div class="notice"><strong>설명용 가상 데이터</strong><br>변화 방향과 크기는 실제 예상 결과가 아닙니다.</div><div class="control"><div class="control-row"><label for="salt-range">NaCl 농도</label><output id="salt-output"></output></div><input id="salt-range" type="range" min="0" max="1.6" step=".1" value=".8"></div><div class="tiny-metrics"><div class="tiny-metric"><small>A₄₃₄</small><b id="a434-output"></b></div><div class="tiny-metric"><small>A₅₇₈</small><b id="a578-output"></b></div><div class="tiny-metric" style="grid-column:1/-1"><small>흡광도비</small><b id="ratio-output"></b></div></div><div class="formula">R = A₅₇₈ / A₄₃₄</div><p class="sim-note">실제 관계는 예비실험과 본실험의 관측값으로 판단합니다.</p></aside></section></main><script src="../js/charts.js"></script><script src="../js/simulations.js"></script><script src="../js/navigation.js"></script></body></html>
