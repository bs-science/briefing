<main class="page-shell"><section class="hero"><div><p class="eyebrow">Simulation 05</p><h1>측정 오차가 스펙트럼을 왜곡하는 방식</h1><p class="lead">기포·지문·pH·온도·장비 잡음을 선택해 정상 스펙트럼과 비교합니다.</p></div><div class="notice"><strong>개념 시뮬레이션</strong><br>각 오차의 모양과 크기는 원리를 설명하기 위한 예시이며 장비별 실제 오차와 다를 수 있습니다.</div></section>
<section class="grid"><article class="panel"><div class="panel-title panel-pad"><h2>정상 측정과 오차 포함 측정</h2><div class="legend"><span style="--legend:#58e0d1">정상</span><span style="--legend:#ff7f8f">오차 포함</span></div></div><div class="chart-wrap"><canvas id="errorChart"></canvas></div></article><aside class="panel panel-pad"><div class="controls"><span id="errorStatus" class="status"></span><div class="check-list"><label class="check"><input type="checkbox" data-error="bubble"><span>큐벳 기포<small>산란과 불규칙한 바탕 증가</small></span></label><label class="check"><input type="checkbox" data-error="fingerprint"><span>큐벳 지문<small>전 파장대 투과율 감소 가능</small></span></label><label class="check"><input type="checkbox" data-error="ph"><span>pH 차이<small>mCP 화학종 비율 변화</small></span></label><label class="check"><input type="checkbox" data-error="temp"><span>온도 차이<small>평형과 흡광도 변화 가능</small></span></label><label class="check"><input type="checkbox" data-error="noise"><span>장비 잡음<small>미세한 농도 효과를 가릴 수 있음</small></span></label></div><button id="resetErrors" class="button">모든 오차 초기화</button></div></aside></section></main><script src="app.js"></script></body></html>
