<body data-page="controls"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span>12조 스펙트라</a><nav class="nav"><a href="index.html">Canva</a><a href="spectrum.html">스펙트럼</a><a href="calibration.html">검량선</a><a href="unknown.html">미지 시료</a><a href="controls.html">통제변인</a><a href="errors.html">측정오차</a><a href="workflow.html">실험과정</a></nav></header>
<main class="page-shell"><section class="hero"><div><p class="eyebrow">Simulation 04</p><h1>통제변인이 결과에 미치는 영향</h1><p class="lead">pH·온도·mCP 첨가량이 달라지면 NaCl 이외의 원인으로 스펙트럼이 변할 수 있음을 보여줍니다.</p></div><div class="notice"><strong>개념 시뮬레이션</strong><br>변화 크기는 교육용으로 과장되거나 단순화되어 있습니다.</div></section>
<section class="grid"><article class="panel"><div class="panel-title panel-pad"><h2>기준 조건과 변경 조건 비교</h2><div class="legend"><span style="--legend:#65a9ff">기준 조건</span><span style="--legend:#ffc86b">변경 조건</span></div></div><div class="chart-wrap"><canvas id="controlsChart"></canvas></div></article><aside class="panel panel-pad"><div class="controls"><span id="controlStatus" class="status"></span><div class="control"><div class="control-head"><label for="salt">NaCl</label><span id="saltValue" class="value"></span></div><input id="salt" type="range" min="0" max="1.6" step="0.1" value="0.8"></div><div class="control"><div class="control-head"><label for="ph">pH</label><span id="phValue" class="value"></span></div><input id="ph" type="range" min="7.8" max="8.6" step="0.01" value="8.2"></div><div class="control"><div class="control-head"><label for="temp">온도</label><span id="tempValue" class="value"></span></div><input id="temp" type="range" min="20" max="30" step="1" value="25"></div><div class="control"><div class="control-head"><label for="dye">mCP 원액</label><span id="dyeValue" class="value"></span></div><input id="dye" type="range" min="0.1" max="0.4" step="0.05" value="0.2"></div></div></aside></section></main><script src="app.js"></script></body></html>
